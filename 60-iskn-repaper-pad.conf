# Xorg InputClass for the Repaper's pad buttons.
#
# The stock 40-libinput.conf ships catchall sections for pointers, keyboards,
# touchpads, touchscreens and tablets, but none for tablet pads.  A device
# tagged only ID_INPUT_TABLET_PAD therefore matches no InputClass, gets no
# driver assigned, and is dropped -- the Xorg log shows "Adding input device"
# with no "Using input driver" line after it.
#
# Install:
#   sudo cp 60-iskn-repaper-pad.conf /etc/X11/xorg.conf.d/
#
# Xorg reads these at server start, so log out and back in for it to apply.

Section "InputClass"
        Identifier "libinput tablet pad catchall"
        MatchIsTabletPad "on"
        Driver "libinput"
EndSection
